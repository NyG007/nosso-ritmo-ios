name: iOS
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify reproducible project and configuration
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- NossoRitmo.xcodeproj
          python3 scripts/verify_project.py
      - name: Test calendar, goals and timer rules
        run: swift test --parallel
      - name: Build app and widget for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project NossoRitmo.xcodeproj -scheme NossoRitmo \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
          if-no-files-found: ignore
      - name: Launch demo and capture themes
        run: python3 scripts/simulator_smoke.py
      - name: Save simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: build/screenshots/*.png
          if-no-files-found: ignore
